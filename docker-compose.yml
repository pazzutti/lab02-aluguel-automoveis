services:
  mysql:
    image: mysql:8.0
    container_name: xulambs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xulambs
      MYSQL_USER: mysql
      MYSQL_PASSWORD: xulambs
    ports:
      - "3306:3306"
    volumes:
      - xulambs-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xulambs-mysql-data:
